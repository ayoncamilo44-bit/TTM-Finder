<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collector Workbench - Master Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Top Navigation Header */
    header { background: #0f172a; border-bottom: 1px solid #334155; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; z-index: 10; }
    
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-logo { background: #0284c7; color: white; font-weight: 900; font-size: 1.1rem; padding: 0.4rem 0.6rem; border-radius: 6px; letter-spacing: 1px; }
    .brand-title { font-size: 1.1rem; font-weight: bold; color: #f8fafc; }
    .brand-subtitle { font-size: 0.75rem; color: #64748b; }

    /* Navigation Tabs */
    nav.tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .tab-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 0.4rem; }
    .tab-btn:hover { background: #334155; color: #f8fafc; }
    .tab-btn.active { background: #0284c7; color: #ffffff; border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.25); }

    /* External Window Control */
    .popout-btn { background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 0.4rem 0.6rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; }
    .popout-btn:hover { color: #38bdf8; border-color: #38bdf8; }

    /* Main Workspace Frame Container */
    main { flex: 1; position: relative; background: #0f172a; }
    iframe { width: 100%; height: 100%; border: none; background: #0f172a; }

    /* Loading Overlay Indicator */
    .frame-loader { position: absolute; inset: 0; background: #0f172a; display: flex; justify-content: center; align-items: center; color: #38bdf8; font-size: 0.9rem; font-weight: bold; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .frame-loader.active { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>

  <!-- Master Top Navigation -->
  <header>
    <div class="brand">
      <div class="brand-logo">TTM</div>
      <div>
        <div class="brand-title">Collector Workbench</div>
        <div class="brand-subtitle">Unified Suite for Autographs, Checklists &amp; Printing</div>
      </div>
    </div>

    <nav class="tabs">
      <button class="tab-btn active" onclick="switchModule('finder.html', this)">
        <span>🎯</span> Master Tracker
      </button>
      <button class="tab-btn" onclick="switchModule('binder-tool.html', this)">
        <span>📋</span> Binder &amp; Set Mapper
      </button>
      <button class="tab-btn" onclick="switchModule('letter-writer.html', this)">
        <span>✍️</span> 3x5 Index Writer
      </button>
      <button class="tab-btn" onclick="switchModule('card-printer.html', this)">
        <span>🖼️</span> Custom Card Printer
      </button>
    </nav>

    <a id="popoutLink" href="finder.html" target="_blank" class="popout-btn" title="Open active module in a new browser tab">
      <span>↗</span> Standalone Tab
    </a>
  </header>

  <!-- Module Display Window -->
  <main>
    <div class="frame-loader" id="loader">Loading Module...</div>
    <iframe id="workspaceFrame" src="finder.html" onload="hideLoader()"></iframe>
  </main>

  <script>
    const iframe = document.getElementById('workspaceFrame');
    const loader = document.getElementById('loader');
    const popoutLink = document.getElementById('popoutLink');

    function switchModule(fileUrl, buttonEl) {
      if (iframe.src.endsWith(fileUrl)) return; // Avoid reload if already on tab

      // Show loader indicator
      loader.classList.add('active');

      // Update active tab visual
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      buttonEl.classList.add('active');

      // Update standalone popout URL
      popoutLink.href = fileUrl;

      // Swap iframe content
      iframe.src = fileUrl;
    }

    function hideLoader() {
      loader.classList.remove('active');
    }
  </script>
</body>
</html>
