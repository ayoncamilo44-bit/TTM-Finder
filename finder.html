<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTM Finder - Master Tracker &amp; Address Roster</title>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 1.5rem; }
    .container { max-width: 1200px; margin: 0 auto; }

    header { border-bottom: 1px solid #334155; padding-bottom: 1rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    h1 { margin: 0; font-size: 1.5rem; color: #38bdf8; }

    /* Summary Stats Bar */
    .stats-bar { display: flex; gap: 1.5rem; background: #1e293b; padding: 1rem; border-radius: 8px; border: 1px solid #334155; margin-bottom: 1.5rem; justify-content: space-around; flex-wrap: wrap; }
    .stat-item { text-align: center; }
    .stat-val { font-size: 1.4rem; font-weight: bold; color: #38bdf8; }
    .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Control Bar */
    .controls-bar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap; background: #1e293b; padding: 1rem; border-radius: 8px; border: 1px solid #334155; }
    .search-group { display: flex; gap: 0.5rem; flex: 1; max-width: 500px; }
    .search-input { background: #0f172a; border: 1px solid #334155; color: white; padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.85rem; width: 100%; }

    .btn-group { display: flex; gap: 0.5rem; }
    .btn { padding: 0.5rem 0.85rem; border-radius: 6px; font-weight: bold; font-size: 0.82rem; cursor: pointer; border: none; transition: background 0.2s; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-success { background: #166534; color: #4ade80; border: 1px solid #22c55e; }
    .btn-secondary { background: #334155; color: #cbd5e1; }

    .filter-btn-group { display: flex; gap: 0.3rem; margin-bottom: 1rem; }
    .filter-btn { background: #0f172a; border: 1px solid #334155; color: #94a3b8; padding: 0.35rem 0.75rem; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
    .filter-btn.active { background: #0284c7; color: white; border-color: #38bdf8; font-weight: bold; }

    /* Data Table */
    .table-container { background: #1e293b; border: 1px solid #334155; border-radius: 8px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
    th { padding: 0.75rem 0.75rem; border-bottom: 2px solid #334155; color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; }
    td { padding: 0.75rem 0.75rem; border-bottom: 1px solid #334155; color: #cbd5e1; vertical-align: middle; }
    tr:hover { background: rgba(51, 65, 85, 0.3); }

    /* Status Badges */
    .badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; display: inline-block; }
    .badge-pending { background: #854d0e; color: #fef08a; }
    .badge-success { background: #166534; color: #4ade80; }
    .badge-rts { background: #991b1b; color: #fca5a5; }

    /* Modal Styling */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 100; }
    .modal-overlay.active { display: flex; }
    .modal { background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 520px; padding: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-title { font-size: 1.2rem; color: #38bdf8; font-weight: bold; margin-bottom: 1rem; }
    
    .form-group { margin-bottom: 0.85rem; }
    .form-group label { display: block; font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 0.3rem; }
    .form-control { width: 100%; background: #0f172a; border: 1px solid #334155; color: white; padding: 0.5rem; border-radius: 6px; font-size: 0.85rem; box-sizing: border-box; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.25rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>🎯 TTM Master Tracker &amp; Address Roster</h1>
        <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 0.2rem;">Log outgoing requests, track turnarounds, and maintain your signer directory.</div>
      </div>
      <div class="btn-group">
        <button class="btn btn-success" onclick="exportCSV()">📥 Export CSV</button>
        <button class="btn btn-primary" onclick="openModal()">+ New TTM Request</button>
      </div>
    </header>

    <!-- Stat Highlights -->
    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-val" id="statSent">0</div>
        <div class="stat-label">Total Sent</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statPending" style="color: #fef08a;">0</div>
        <div class="stat-label">Pending</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statSuccess" style="color: #4ade80;">0</div>
        <div class="stat-label">Successes</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statRate" style="color: #38bdf8;">0%</div>
        <div class="stat-label">Success Rate</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="statAvgDays">0 days</div>
        <div class="stat-label">Avg Turnaround</div>
      </div>
    </div>

    <!-- Controls & Filters -->
    <div class="controls-bar">
      <div class="search-group">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search player, team, sport, or address..." oninput="renderTable()">
      </div>
      <div class="filter-btn-group" style="margin-bottom:0;">
        <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
        <button class="filter-btn" onclick="setFilter('Pending', this)">Pending</button>
        <button class="filter-btn" onclick="setFilter('Success', this)">Success</button>
        <button class="filter-btn" onclick="setFilter('RTS', this)">RTS / Failed</button>
      </div>
    </div>

    <!-- Master Roster Table -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Player Name</th>
            <th>Sport / Team</th>
            <th>Sent Date</th>
            <th>Returned Date</th>
            <th>Turnaround</th>
            <th>Status</th>
            <th>Mailing Address</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="trackerTableBody">
          <!-- Rows render dynamically -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Add/Edit Entry Modal -->
  <div class="modal-overlay" id="entryModal">
    <div class="modal">
      <div class="modal-title" id="modalTitle">Add New TTM Entry</div>
      <form id="ttmForm" onsubmit="saveEntry(event)">
        <input type="hidden" id="entryId">
        
        <div class="form-row">
          <div class="form-group">
            <label>Player Name *</label>
            <input type="text" id="playerName" class="form-control" required placeholder="e.g. Jack Youngblood">
          </div>
          <div class="form-group">
            <label>Sport / Team</label>
            <input type="text" id="playerTeam" class="form-control" placeholder="e.g. NFL / LA Rams">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Date Sent *</label>
            <input type="date" id="dateSent" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Date Returned</label>
            <input type="date" id="dateReturned" class="form-control">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Status</label>
            <select id="status" class="form-control">
              <option value="Pending">Pending</option>
              <option value="Success">Success</option>
              <option value="RTS">RTS (Return To Sender)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Enclosures</label>
            <input type="text" id="enclosures" class="form-control" placeholder="e.g. 1985 Topps, 3x5 index">
          </div>
        </div>

        <div class="form-group">
          <label>Mailing Address</label>
          <input type="text" id="address" class="form-control" placeholder="Street, City, State ZIP">
        </div>

        <div class="form-group">
          <label>Notes</label>
          <input type="text" id="notes" class="form-control" placeholder="e.g. Signed in blue Sharpie, fee paid, etc.">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Entry</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Initial Master Roster Data
    let ttmEntries = [
      {
        id: "1",
        name: "Jack Youngblood",
        team: "NFL / LA Rams",
        sent: "2026-08-10",
        returned: "2026-08-28",
        status: "Success",
        enclosures: "1981 Topps, 3x5 Card",
        address: "P.O. Box 123, Orlando, FL",
        notes: "Signed card in blue Sharpie, added HOF '01 inscription"
      },
      {
        id: "2",
        name: "Jim Everett",
        team: "NFL / LA Rams",
        sent: "2026-09-01",
        returned: "",
        status: "Pending",
        enclosures: "1989 Pro Set",
        address: "123 Main St, Irvine, CA",
        notes: "Sent with LOR and SASE"
      }
    ];

    let currentFilter = 'all';

    function initTracker() {
      renderTable();
      updateStats();
    }

    function calculateDays(sentStr, retStr) {
      if (!sentStr) return "-";
      const sent = new Date(sentStr);
      const ret = retStr ? new Date(retStr) : new Date();
      const diffTime = Math.abs(ret - sent);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return retStr ? `${diffDays} days` : `${diffDays} days active`;
    }

    function updateStats() {
      const total = ttmEntries.length;
      const pending = ttmEntries.filter(e => e.status === 'Pending').length;
      const success = ttmEntries.filter(e => e.status === 'Success').length;
      const rate = total > 0 ? Math.round((success / total) * 100) : 0;

      // Avg turnaround calculation
      const completed = ttmEntries.filter(e => e.status === 'Success' && e.returned && e.sent);
      let totalDays = 0;
      completed.forEach(e => {
        const s = new Date(e.sent);
        const r = new Date(e.returned);
        totalDays += Math.max(0, Math.ceil((r - s) / (1000 * 60 * 60 * 24)));
      });
      const avg = completed.length > 0 ? Math.round(totalDays / completed.length) : 0;

      document.getElementById('statSent').textContent = total;
      document.getElementById('statPending').textContent = pending;
      document.getElementById('statSuccess').textContent = success;
      document.getElementById('statRate').textContent = `${rate}%`;
      document.getElementById('statAvgDays').textContent = `${avg} days`;
    }

    function renderTable() {
      const tbody = document.getElementById('trackerTableBody');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      tbody.innerHTML = '';

      ttmEntries.forEach(entry => {
        const matchesFilter = currentFilter === 'all' || entry.status === currentFilter;
        const matchesSearch = 
          entry.name.toLowerCase().includes(searchQuery) ||
          entry.team.toLowerCase().includes(searchQuery) ||
          entry.address.toLowerCase().includes(searchQuery) ||
          entry.notes.toLowerCase().includes(searchQuery);

        if (matchesFilter && matchesSearch) {
          const daysText = calculateDays(entry.sent, entry.returned);
          let badgeClass = 'badge-pending';
          if (entry.status === 'Success') badgeClass = 'badge-success';
          if (entry.status === 'RTS') badgeClass = 'badge-rts';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="font-weight: bold; color: #f8fafc;">${entry.name}</td>
            <td style="color: #94a3b8;">${entry.team || '-'}</td>
            <td>${entry.sent || '-'}</td>
            <td>${entry.returned || '-'}</td>
            <td style="font-size: 0.8rem; color: #38bdf8;">${daysText}</td>
            <td><span class="badge ${badgeClass}">${entry.status}</span></td>
            <td style="font-size: 0.8rem; color: #94a3b8; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${entry.address}">${entry.address || '-'}</td>
            <td>
              <button class="btn btn-secondary" style="padding: 0.2rem 0.4rem; font-size: 0.75rem;" onclick="editEntry('${entry.id}')">Edit</button>
              <button class="btn btn-secondary" style="padding: 0.2rem 0.4rem; font-size: 0.75rem; color: #fca5a5;" onclick="deleteEntry('${entry.id}')">✕</button>
            </td>
          `;
          tbody.appendChild(tr);
        }
      });
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      renderTable();
    }

    function openModal(editId = null) {
      const modal = document.getElementById('entryModal');
      const form = document.getElementById('ttmForm');
      form.reset();

      if (editId) {
        const entry = ttmEntries.find(e => e.id === editId);
        if (entry) {
          document.getElementById('modalTitle').textContent = "Edit TTM Entry";
          document.getElementById('entryId').value = entry.id;
          document.getElementById('playerName').value = entry.name;
          document.getElementById('playerTeam').value = entry.team;
          document.getElementById('dateSent').value = entry.sent;
          document.getElementById('dateReturned').value = entry.returned;
          document.getElementById('status').value = entry.status;
          document.getElementById('enclosures').value = entry.enclosures;
          document.getElementById('address').value = entry.address;
          document.getElementById('notes').value = entry.notes;
        }
      } else {
        document.getElementById('modalTitle').textContent = "Add New TTM Entry";
        document.getElementById('entryId').value = "";
        document.getElementById('dateSent').valueAsDate = new Date();
      }

      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('entryModal').classList.remove('active');
    }

    function saveEntry(e) {
      e.preventDefault();
      const id = document.getElementById('entryId').value;
      const newEntry = {
        id: id || Date.now().toString(),
        name: document.getElementById('playerName').value,
        team: document.getElementById('playerTeam').value,
        sent: document.getElementById('dateSent').value,
        returned: document.getElementById('dateReturned').value,
        status: document.getElementById('status').value,
        enclosures: document.getElementById('enclosures').value,
        address: document.getElementById('address').value,
        notes: document.getElementById('notes').value
      };

      if (id) {
        const idx = ttmEntries.findIndex(item => item.id === id);
        if (idx !== -1) ttmEntries[idx] = newEntry;
      } else {
        ttmEntries.unshift(newEntry);
      }

      closeModal();
      updateStats();
      renderTable();
    }

    function editEntry(id) {
      openModal(id);
    }

    function deleteEntry(id) {
      if (confirm("Delete this entry?")) {
        ttmEntries = ttmEntries.filter(e => e.id !== id);
        updateStats();
        renderTable();
      }
    }

    function exportCSV() {
      if (ttmEntries.length === 0) return alert("No entries to export!");

      let csv = "data:text/csv;charset=utf-8,Player Name,Sport/Team,Date Sent,Date Returned,Status,Enclosures,Address,Notes\n";
      ttmEntries.forEach(e => {
        csv += `"${e.name}","${e.team}","${e.sent}","${e.returned}","${e.status}","${e.enclosures}","${e.address}","${e.notes}"\n`;
      });

      const encoded = encodeURI(csv);
      const link = document.createElement("a");
      link.setAttribute("href", encoded);
      link.setAttribute("download", "ttm_master_tracker.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    document.addEventListener("DOMContentLoaded", initTracker);
  </script>
</body>
</html>
