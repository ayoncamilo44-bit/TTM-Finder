<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collector Workbench - Master Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative; }

    /* =========================================================
       Ambient Floating Cards Background (Faded & Drifting)
       ========================================================= */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
      opacity: 0.06; /* Faded so it never interferes with text/prompts */
    }

    .floating-card {
      position: absolute;
      width: 140px;
      height: 196px; /* 2.5 x 3.5 Aspect Ratio */
      border: 2px solid #38bdf8;
      border-radius: 8px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(15, 23, 42, 0.8) 100%);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 10px;
      transform: rotate(-12deg);
      filter: blur(0.5px);
    }

    /* Simulated Autograph Script & Photo Frame Inside Card */
    .card-photo-box { width: 100%; height: 60%; background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
    .card-sig-line { 
      font-family: 'Brush Script MT', cursive, sans-serif; 
      font-size: 1.2rem; 
      color: #38bdf8; 
      text-align: center; 
      transform: rotate(-5deg); 
      letter-spacing: 1px;
    }

    /* Drift Animation Schedules */
    .card-1 { top: 15%; left: -180px; animation: floatRight 38s linear infinite; }
    .card-2 { top: 55%; left: -180px; animation: floatRight 48s linear infinite 12s; transform: rotate(15deg); }
    .card-3 { top: 30%; right: -180px; animation: floatLeft 42s linear infinite 5s; transform: rotate(-8deg); }
    .card-4 { top: 75%; right: -180px; animation: floatLeft 52s linear infinite 22s; transform: rotate(20deg); }

    @keyframes floatRight {
      0% { transform: translateX(0) translateY(0) rotate(-12deg); }
      50% { transform: translateX(60vw) translateY(-30px) rotate(5deg); }
      100% { transform: translateX(115vw) translateY(10px) rotate(-10deg); }
    }

    @keyframes floatLeft {
      0% { transform: translateX(0) translateY(0) rotate(15deg); }
      50% { transform: translateX(-60vw) translateY(40px) rotate(-5deg); }
      100% { transform: translateX(-115vw) translateY(-20px) rotate(12deg); }
    }

    /* =========================================================
       Master UI Layout Controls
       ========================================================= */
    header { 
      background: rgba(15, 23, 42, 0.95); 
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #334155; 
      padding: 0.75rem 1.5rem; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-wrap: wrap; 
      gap: 1rem; 
      z-index: 10; 
    }
    
    .brand { display: flex; align-items: center; gap: 0.75rem; }
    .brand-logo { background: #0284c7; color: white; font-weight: 900; font-size: 1.1rem; padding: 0.4rem 0.6rem; border-radius: 6px; letter-spacing: 1px; }
    .brand-title { font-size: 1.1rem; font-weight: bold; color: #f8fafc; }
    .brand-subtitle { font-size: 0.75rem; color: #64748b; }

    nav.tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .tab-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 0.4rem; }
    .tab-btn:hover { background: #334155; color: #f8fafc; }
    .tab-btn.active { background: #0284c7; color: #ffffff; border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.25); }

    .popout-btn { background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 0.4rem 0.6rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; }
    .popout-btn:hover { color: #38bdf8; border-color: #38bdf8; }

    main { flex: 1; position: relative; background: transparent; z-index: 5; }
    iframe { width: 100%; height: 100%; border: none; background: transparent; }

    .frame-loader { position: absolute; inset: 0; background: #0f172a; display: flex; justify-content: center; align-items: center; color: #38bdf8; font-size: 0.9rem; font-weight: bold; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 6; }
    .frame-loader.active { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>

  <!-- Ambient Faded Background (Floating Cards & Signatures) -->
  <div class="ambient-bg">
    <div class="floating-card card-1">
      <div class="card-photo-box"></div>
      <div class="card-sig-line">Authentic</div>
    </div>
    <div class="floating-card card-2">
      <div class="card-photo-box"></div>
      <div class="card-sig-line">Vintage #85</div>
    </div>
    <div class="floating-card card-3">
      <div class="card-photo-box"></div>
      <div class="card-sig-line">Hall of Fame</div>
    </div>
    <div class="floating-card card-4">
      <div class="card-photo-box"></div>
      <div class="card-sig-line">Signed TTM</div>
    </div>
  </div>

  <!-- Master Top Navigation -->
  <header>
    <div class="brand">
      <div class="brand-logo">TTM</div>
      <div>
        <div class="brand-title">Collector Workbench</div>
        <div class="brand-subtitle">Unified Suite for Autographs, Checklists &amp; Printing</div>
      </div>
    </div>

    <nav class="tabs">
      <button class="tab-btn active" onclick="switchModule('finder.html', this)">
        <span>🎯</span> Master Tracker
      </button>
      <button class="tab-btn" onclick="switchModule('binder-tool.html', this)">
        <span>📋</span> Binder &amp; Set Mapper
      </button>
      <button class="tab-btn" onclick="switchModule('letter-writer.html', this)">
        <span>✍️</span> 3x5 Index Writer
      </button>
      <button class="tab-btn" onclick="switchModule('card-printer.html', this)">
        <span>🖼️</span> Custom Card Printer
      </button>
    </nav>

    <a id="popoutLink" href="finder.html" target="_blank" class="popout-btn" title="Open active module in a new browser tab">
      <span>↗</span> Standalone Tab
    </a>
  </header>

  <!-- Module Display Window -->
  <main>
    <div class="frame-loader" id="loader">Loading Module...</div>
    <iframe id="workspaceFrame" src="finder.html" onload="hideLoader()"></iframe>
  </main>

  <script>
    const iframe = document.getElementById('workspaceFrame');
    const loader = document.getElementById('loader');
    const popoutLink = document.getElementById('popoutLink');

    function switchModule(fileUrl, buttonEl) {
      if (iframe.src.endsWith(fileUrl)) return;

      loader.classList.add('active');

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      buttonEl.classList.add('active');

      popoutLink.href = fileUrl;
      iframe.src = fileUrl;
    }

    function hideLoader() {
      loader.classList.remove('active');
    }
  </script>
</body>
</html>
