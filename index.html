<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Sports Card Workbench</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f9; color: #333; }
        h1 { text-align: center; color: #111; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #007bff; color: white; }
        tr:hover { background-color: #f1f1f1; }
    </style>
</head>
<body>

<div class="container">
    <h1>Global Sports Card Collection</h1>
    <p style="text-align: center;">Tracking Football, Baseball, Basketball, Soccer, Rugby, and Cricket.</p>
    
    <table id="cardTable">
        <thead>
            <tr>
                <th>Sport</th>
                <th>Player</th>
                <th>Year</th>
                <th>Brand</th>
                <th>Card #</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data will load here automatically -->
        </tbody>
    </table>
</div>

<script>
    // Fetch the JSON file generated by your Python script
    fetch('collection_data.json')
        .then(response => response.json())
        .then(data => {
            const tableBody = document.querySelector('#cardTable tbody');
            data.forEach(card => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${card.sport}</strong></td>
                    <td>${card.player_name}</td>
                    <td>${card.year || ''}</td>
                    <td>${card.brand || ''}</td>
                    <td>${card.card_number || ''}</td>
                    <td>${card.status}</td>
                `;
                tableBody.appendChild(row);
            });
        })
        .catch(error => {
            console.error('Error loading collection data:', error);
            const tableBody = document.querySelector('#cardTable tbody');
            tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">No collection data found yet. Run your Python export script!</td></tr>`;
        });
</script>

</body>
</html>
